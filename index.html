<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Музыкальный плеер</title>

    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter&display=swap">
</head>
<body>

    <!-- Yandex.Metrika counter -->
    <script type="text/javascript">
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=112395069', 'ym');

        ym(112395069, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
    </script>
    <noscript><div><img src="https://mc.yandex.ru/watch/112395069" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
    <!-- /Yandex.Metrika counter -->

    <div class="music-player">
        <div class="song-image-container">
            <img src="" alt="Image" id="song-image">
        </div>

        <div class="song-info-container">
            <h2 id="song-name"></h2>
            <p id="song-album-year">
                <span id="song-album"></span>
                <span id="song-year"></span>
            </p>
            <p id="song-artist"></p>
        </div>

        <div class="buttons-container">
            <button id="shuffle-button">
                <i class="fa-solid fa-shuffle"></i>
            </button>

            <button id="prev-button">
                <i class="fa-solid fa-backward"></i>
            </button>

            <button id="play-pause-button">
                <i class="fa-solid fa-play"></i>
            </button>

            <button id="next-button">
                <i class="fa-solid fa-forward"></i>
            </button>

            <button id="repeat-button">
                <i class="fa-solid fa-repeat"></i>
            </button>
        </div>

        <div class="progress-container">
            <input type="range" id="progress-bar">
        </div>

        <div class="time-container">
            <span id="current-time"></span>
            <span id="duration"></span>
        </div>

        <div class="volume-container">
            <button id="volume-button">
                <i class="fa-solid fa-volume"></i>
            </button>

            <input type="range" id="volume-bar" max="1" step="0.02">

            <span id="current-volume"></span>
        </div>

        <div class="playlist-container">
            <div class="playlist-header">
                <h3 id="playlist-name">Плейлист</h3>
                <button id="add-songs-button" class="add-songs-button">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <input
                    type="file"
                    id="add-songs-input"
                    accept="audio/*"
                    multiple
                    hidden
                >
            </div>
            <div id="playlist-songs"></div>
        </div>

        <div class="playlist-button-container">
            <button id="playlist-button">
                <i class="fa-solid fa-music"></i>
            </button>
        </div>

        <audio src="audio/blank.mp3" id="audio" preload="metadata"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
